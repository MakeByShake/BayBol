<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESC%" />
    <meta name="theme-color" content="#070B1A" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / соцсети -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BayBol Visa" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESC%" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="kk_KZ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESC%" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Шрифты: Geologica (заголовки) + Onest (текст), обе с полной поддержкой казахских букв -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap&subset=cyrillic,cyrillic-ext,latin"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap&subset=cyrillic,cyrillic-ext,latin" />
    </noscript>

    <!-- %SEO_SCHEMA% — разметка schema.org (LocalBusiness + FAQPage) подставляется при сборке из config -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
